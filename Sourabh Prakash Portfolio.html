  { n: 3, title: 'Learning by Doing', period: 'Internships', syn: 'Two internships outside the classroom: eleven months of teaching and a retail operations internship at V Mart.',
    eps: [
      { t: 'The Teacher', d: 'Teaching Intern. Managed classroom activities, delivered structured lessons and developed engagement materials.', tags: ['Teaching', 'Communication'], run: '11 months', pal: 'jade' },
      { t: 'The Operator', d: 'Retail Operations & Sales Intern at V Mart. Studied store operations, sales and category management.', tags: ['Retail', 'Sales', 'Category management'], run: 'Jun – Aug 2026', pal: 'amber' }] },
  { n: 4, title: 'Enter: Business', period: '2025 – 2027', syn: 'An MBA in Marketing & Finance at Babu Banarasi Das University, Lucknow, with two research projects.',
    eps: [
      { t: 'The MBA', d: 'MBA in Marketing & Finance, combining the technical background with business training.', tags: ['Marketing', 'Finance'], run: '2025 – 2027', pal: 'crimson' },
      { t: 'The Researcher', d: 'Led an independent study of AI usage in online stock trading among young investors: surveys, primary data, adoption patterns.', tags: ['Research', 'Surveys', 'AI'], run: '2025', pal: 'violet' },
      { t: 'The Strategist', d: 'Examined how pricing strategies affect retail margins and sales volumes at V Mart.', tags: ['Pricing', 'Margin', 'Volume'], run: '2026', pal: 'ocean' },
      { t: 'The Score', d: 'NMAT score of 162.', tags: ['NMAT'], run: '162', pal: 'jade' }] },
  { n: 5, title: 'What’s Next', period: 'Now streaming', syn: 'The next arc is a first full role that sits between technology teams and business clients.',
    eps: [{ t: 'The Next Chapter', d: 'Looking for Business Analyst, Project Operations, Functional Trainee or Data Analyst roles. Hybrid preferred, open to Lucknow, Delhi NCR, Noida and Bengaluru.', tags: ['Business Analyst', 'Project Operations', 'Functional Trainee', 'Data Analyst'], run: 'Open to offers', pal: 'crimson' }] }
];
var PICKS = [
  { label: 'Entrance score', title: 'NMAT 162', detail: 'MBA admission test', pal: 'jade' },
  { label: 'Current degree', title: 'MBA', detail: 'Marketing & Finance, 2025 – 2027', pal: 'crimson' },
  { label: 'The tech base', title: 'BCA', detail: 'Computer Applications, 2021 – 2024', pal: 'ocean' },
  { label: 'Latest internship', title: 'V Mart', detail: 'Retail Operations & Sales, Jun – Aug 2026', pal: 'amber' },
  { label: 'Research', title: 'AI in Trading', detail: 'Independent study with primary data', pal: 'violet' },
  { label: 'Longest role', title: '11 months', detail: 'Teaching Intern', pal: 'jade' },
  { label: 'Spreadsheet skills', title: 'Advanced Excel', detail: 'Listed under technical skills', pal: 'amber' }
];
var INTRO = [
  { k: 'Education', t: 'MBA · Marketing & Finance', l: ['Babu Banarasi Das University, Lucknow', '2025 – 2027'], c: ['NMAT 162'] },
  { k: 'Foundation', t: 'BCA first.', l: ['Computer Applications, 2021 – 2024', 'After a Diploma in Civil Engineering'], c: ['Programming & IT', 'BCA Intern 2024'] },
  { k: 'Experience', t: 'Learning by Doing', l: ['Retail Operations & Sales Intern at V Mart', 'Teaching Intern for 11 months'] },
  { k: 'Projects', t: 'Two Originals', l: ['AI in Online Stock Trading', 'Pricing Strategy, Margin & Volume at V Mart'] },
  { k: 'Skills', t: 'Analysis with context', l: ['Data Analysis · Market Research · Reporting', 'Advanced Excel · AI Tools · Stakeholder Communication'] },
  { k: 'Now', t: 'Open to roles', l: ['Business Analyst · Project Operations · Functional Trainee', 'Hybrid · Lucknow, Delhi NCR, Noida, Bengaluru'] }
];
var SEC = {
  about:     { nav: 'About',   title: 'About Me',       meta: 'The Pilot · Education & experience' },
  journey:   { nav: 'Journey', title: 'My Journey',     meta: SEASONS.length + ' seasons · ' + SEASONS.reduce(function (n, s) { return n + s.eps.length; }, 0) + ' episodes' },
  originals: { nav: 'Originals', title: 'My Projects',  meta: PROJECTS.length + ' originals' },
  picks:     { nav: 'Top Picks', title: 'Top Picks',    meta: 'Highlights from the CV' },
  skills:    { nav: 'Skills',  title: 'My Skills',      meta: SKILLS.length + ' categories' },
  story:     { nav: 'Resume',  title: 'The Full Story', meta: 'Resume at a glance' }
};
var VIEWERS = [
  { id: 'sourabh', name: 'Sourabh', blurb: 'The full series, in order', color: '#e5132b', order: ['about','journey','originals','picks','skills','story'] },
  { id: 'recruiter', name: 'Recruiter', blurb: 'Resume and skills first', color: '#2fa8d8', order: ['story','skills','originals','about','journey','picks'] },
  { id: 'analyst', name: 'Hiring manager', blurb: 'Projects and skills first', color: '#2fbf8c', order: ['originals','skills','about','story','journey','picks'] },
  { id: 'story', name: 'Storyteller', blurb: 'The journey and highlights first', color: '#e09a2c', order: ['journey','picks','originals','about','skills','story'] }
];

/* ===== helpers ===== */
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var pv = function (k) { var p = PAL[k]; return '--c1:' + p.c1 + ';--c2:' + p.c2 + ';--c3:' + p.c3 + ';--ac:' + p.ac; };
var chips = function (a) { return '<ul class="chips">' + a.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>'; };
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
function toast(msg) {
  var t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(function () { t.remove(); }, 1800);
}
function copyText(text, label) {
  var done = function () { toast(label + ' copied'); };
  var fallback = function () {
    var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('Select the text to copy it'); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}
var PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';

/* ===== render: hero, nav ===== */
$('#hero').innerHTML =
  '<div class="hero-in">' +
  '<p class="series"><b>THE</b> SERIES</p>' +
  '<h1>' + P.first + '</h1>' +
  '<p class="fullname">' + P.name + ' · ' + P.location + '</p>' +
  '<ul class="tags">' + P.tagline.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>' +
  '<p class="intro">' + P.intro + '</p>' +
  '<ul class="facts">' + P.facts.map(function (f) { return '<li>' + f + '</li>'; }).join('') + '</ul>' +
  '<div class="cta">' +
  '<button class="btn primary" id="play">' + PLAY + 'Play Intro</button>' +
  '<button class="btn ghost" id="more">More Info</button>' +
  '<a class="btn ghost" href="' + P.linkedin + '" target="_blank" rel="noopener">LinkedIn</a>' +
  '</div></div>';

/* ===== render: sections ===== */
function rowShell(inner) {
  return '<div class="row"><button class="rbtn l" aria-label="Scroll left">‹</button><div class="track">' + inner + '</div><button class="rbtn r" aria-label="Scroll right">›</button></div>';
}
function head(id) { return '<div class="sec-head"><h2>' + SEC[id].title + '</h2><span>' + SEC[id].meta + '</span></div>'; }

var builders = {
  about: function () {
    var edu = EDU.map(function (e) {
      return '<div class="entry"><h4>' + e.degree + '</h4><p class="sub">' + e.school + ', ' + e.place + '</p><p class="period">' + e.period + (e.score ? ' · ' + e.score : '') + '</p></div>';
    }).join('');
    var exp = EXP.map(function (e) {
      return '<div class="entry"><h4>' + e.role + '</h4><p class="sub">' + e.org + (e.place ? ', ' + e.place : '') + '</p><p class="period">' + e.period + '</p><ul>' + e.points.map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ul></div>';
    }).join('');
    return head('about') + '<div class="about-grid"><div class="panel"><h3>Education</h3>' + edu + '</div><div class="panel"><h3>Experience</h3>' + exp + '</div></div>';
  },
  journey: function () {
    return head('journey') + '<div class="seasons" id="seasons" role="group" aria-label="Seasons"></div><div id="synopsis" class="synopsis"></div><div id="episodes"></div>';
  },
  originals: function () {
    var cards = PROJECTS.map(function (p, i) {
      return '<button class="card wide" data-proj="' + i + '" style="' + pv(p.pal) + '">' +
        '<div class="thumb"><span class="code">' + p.genre.toUpperCase() + ' · ' + p.year + '</span><span class="big">' + p.title + '</span><span class="mono" aria-hidden="true">' + p.mono + '</span></div>' +
        '<div class="cbody"><p>' + p.logline + '</p>' + chips(p.stack) + '<span class="more">View details →</span></div></button>';
    }).join('');
    return head('originals') + rowShell(cards);
  },
  picks: function () {
    var cards = PICKS.map(function (p) {
      return '<div class="card" style="' + pv(p.pal) + '"><div class="thumb"><span class="code">' + p.label.toUpperCase() + '</span><span class="big">' + p.title + '</span></div><div class="cbody"><p>' + p.detail + '</p></div></div>';
    }).join('');
    return head('picks') + rowShell(cards);
  },
  skills: function () {
    var cats = SKILLS.map(function (c) {
      var items = c.items.map(function (s) {
        var ev = EVIDENCE[s[0]];
        return '<div class="skill"><span class="m" aria-hidden="true">' + s[1] + '</span><div><b>' + s[0] + '</b>' + (ev ? '<small>Seen in: ' + ev + '</small>' : '') + '</div></div>';
      }).join('');
      return '<div class="skillcat"><h3>' + c.title + '<small>' + c.sub + '</small></h3><div class="skills" style="--cols:' + (c.items.length === 6 ? 3 : Math.min(c.items.length, 4)) + '">' + items + '</div></div>';
    }).join('');
    return head('skills') + cats;
  },
  story: function () {
    return head('story') +
      '<div class="resume"><p class="lead">' + P.intro + '</p>' +
      '<div class="rtop"><button class="pill" id="copyEmail">Copy email</button><button class="pill" id="copyResume">Copy resume as text</button><a class="pill" href="' + P.linkedin + '" target="_blank" rel="noopener">LinkedIn profile</a></div>' +
      '<div class="about-grid"><div class="panel"><h3>Target roles</h3>' + chips(['Business Analyst', 'Project Operations Trainee', 'Functional Trainee', 'Data Analyst']) +
      '<p class="sub" style="color:var(--muted);margin:12px 0 0;font-size:.9rem">Entry level, MBA graduate · hybrid · relocation open to Lucknow, Delhi NCR, Noida and Bengaluru.</p></div>' +
      '<div class="panel"><h3>Contact</h3><p style="margin:0">Email: <span class="em" style="user-select:all">' + P.email + '</span></p><p style="margin:6px 0 0;color:var(--muted)">' + P.location + '</p></div></div></div>';
  }
};

var main = $('#main');
Object.keys(builders).forEach(function (id) {
  var s = document.createElement('section'); s.className = 'sec'; s.id = 'sec-' + id; s.dataset.id = id;
  s.innerHTML = builders[id](); main.appendChild(s);
});

/* journey: season tabs + episode row */
var curSeason = 0;
function renderSeason() {
  var s = SEASONS[curSeason];
  $('#seasons').innerHTML = SEASONS.map(function (x, i) {
    return '<button data-s="' + i + '" aria-pressed="' + (i === curSeason) + '">S' + x.n + ' · ' + x.title + '</button>';
  }).join('');
  $('#synopsis').innerHTML = '<b>' + s.period + '.</b> ' + s.syn;
  $('#episodes').innerHTML = rowShell(s.eps.map(function (e, i) {
    var code = 'S0' + s.n + ' E0' + (i + 1);
    return '<div class="card" style="' + pv(e.pal) + '"><div class="thumb"><span class="code">' + code + '</span><span class="big">' + e.t + '</span></div><div class="cbody"><p>' + e.d + '</p>' + chips(e.tags) + '<span class="run">' + e.run + '</span></div></div>';
  }).join(''));
  wireRows($('#episodes'));
}
$('#seasons').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-s]'); if (!b) return; curSeason = +b.dataset.s; renderSeason();
});

/* rows: scroll buttons */
function wireRows(root) {
  $$('.row', root).forEach(function (r) {
    var t = $('.track', r);
    $('.rbtn.l', r).onclick = function () { t.scrollBy({ left: -t.clientWidth * .85, behavior: reduce ? 'auto' : 'smooth' }); };
    $('.rbtn.r', r).onclick = function () { t.scrollBy({ left: t.clientWidth * .85, behavior: reduce ? 'auto' : 'smooth' }); };
  });
}

/* viewer profiles: reorder sections, nav links */
var viewer = VIEWERS[0];
function applyViewer(v) {
  viewer = v; store.set('sp-viewer', v.id);
  $$('.sec').forEach(function (s) { s.style.order = v.order.indexOf(s.dataset.id); });
  $('#links').innerHTML = v.order.map(function (id) { return '<button data-go="' + id + '">' + SEC[id].nav + '</button>'; }).join('');
  $('#who').innerHTML =
    '<button id="whoBtn" aria-haspopup="menu" aria-expanded="false"><span class="avatar" style="--pc:' + v.color + '">' + v.name.charAt(0) + '</span><span class="who-name">' + v.name + '</span></button>' +
    '<div class="menu" id="menu" role="menu" aria-label="Choose a viewer profile" hidden>' +
    VIEWERS.map(function (x) {
      return '<button role="menuitemradio" aria-checked="' + (x.id === v.id) + '" data-v="' + x.id + '"><span class="avatar" style="--pc:' + x.color + '">' + x.name.charAt(0) + '</span><span><b>' + x.name + '</b><small>' + x.blurb + '</small></span></button>';
    }).join('') + '</div>';
}
function goTo(id) { var el = $('#sec-' + id); if (el) el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); }
document.addEventListener('click', function (e) {
  var go = e.target.closest('[data-go]'); if (go) { goTo(go.dataset.go); return; }
  var wb = e.target.closest('#whoBtn');
  var menu = $('#menu');
  if (wb) { var open = menu.hidden; menu.hidden = !open; wb.setAttribute('aria-expanded', String(open)); return; }
  var vb = e.target.closest('[data-v]');
  if (vb) { applyViewer(VIEWERS.filter(function (x) { return x.id === vb.dataset.v; })[0]); toast('Watching as ' + viewer.name); return; }
  if (menu && !menu.hidden && !e.target.closest('#who')) { menu.hidden = true; var b = $('#whoBtn'); if (b) b.setAttribute('aria-expanded', 'false'); }
  var pj = e.target.closest('[data-proj]'); if (pj) { openProject(PROJECTS[+pj.dataset.proj]); return; }
  if (e.target.closest('#play')) { openIntro(); return; }
  if (e.target.closest('#more')) { goTo('story'); return; }
  if (e.target.closest('#brand')) { window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); return; }
  if (e.target.closest('#copyEmail')) { copyText(P.email, 'Email'); return; }
  if (e.target.closest('#copyResume')) { copyText(resumeText(), 'Resume'); return; }
});

function resumeText() {
  var L = [P.name + ' · ' + P.role, P.location + ' · ' + P.email, '', 'SUMMARY', P.intro, '', 'EDUCATION'];
  EDU.forEach(function (e) { L.push('- ' + e.degree + ', ' + e.school + ', ' + e.place + ' (' + e.period + ')' + (e.score ? ' · ' + e.score : '')); });
  L.push('', 'EXPERIENCE');
  EXP.forEach(function (e) { L.push('- ' + e.role + ', ' + e.org + ' (' + e.period + ')'); e.points.forEach(function (p) { L.push('  ' + p); }); });
  L.push('', 'PROJECTS');
  PROJECTS.forEach(function (p) { L.push('- ' + p.title + ' (' + p.year + '): ' + p.logline); });
  L.push('', 'SKILLS');
  SKILLS.forEach(function (c) { L.push(c.title + ': ' + c.items.map(function (s) { return s[0]; }).join(', ')); });
  return L.join('\n');
}

/* ===== overlays ===== */
var lastFocus = null;
function openScrim(inner, cls) {
  lastFocus = document.activeElement;
  var s = document.createElement('div'); s.className = 'scrim'; s.innerHTML = inner;
  s.addEventListener('click', function (e) { if (e.target === s || e.target.closest('.x')) closeScrim(); });
  document.body.appendChild(s); document.body.style.overflow = 'hidden';
  var x = $('.x', s); if (x) x.focus();
  return s;
}
function closeScrim() {
  var s = $('.scrim'); if (s) s.remove();
  document.body.style.overflow = ''; if (lastFocus && lastFocus.focus) lastFocus.focus();
}
function openProject(p) {
  openScrim('<div class="modal" role="dialog" aria-modal="true" aria-label="' + p.title + '"><button class="x" aria-label="Close">×</button>' +
    '<div class="thumb" style="' + pv(p.pal) + '"><span class="code">' + p.genre.toUpperCase() + ' · ' + p.year + '</span><span class="big">' + p.title + '</span><span class="mono" aria-hidden="true">' + p.mono + '</span></div>' +
    '<div class="mbody"><p style="margin:0;font-size:1.05rem">' + p.logline + '</p>' +
    '<div><h3>What I did</h3><ul>' + p.did.map(function (d) { return '<li>' + d + '</li>'; }).join('') + '</ul></div>' +
    '<div><h3>Methods & tools</h3>' + chips(p.stack) + '</div><div><h3>Focus</h3>' + chips(p.focus) + '</div></div></div>');
}

var introTimer = null, introIdx = 0, introPaused = false;
function openIntro() {
  var slides = [{ studio: true }].concat(INTRO);
  introIdx = 0; introPaused = reduce;
  var s = document.createElement('div'); s.className = 'intro-o'; s.setAttribute('role', 'dialog'); s.setAttribute('aria-modal', 'true'); s.setAttribute('aria-label', 'Intro');
  lastFocus = document.activeElement;
  s.innerHTML = '<div class="stage" id="stage" aria-live="polite"></div><div class="ibar"><div class="dots" id="dots"></div><button id="ip">' + (introPaused ? 'Play' : 'Pause') + '</button><button id="ib">Back</button><button id="in">Next</button><button id="ix">Skip</button></div>';
  document.body.appendChild(s); document.body.style.overflow = 'hidden';
  function draw() {
    var sl = slides[introIdx];
    $('#stage').innerHTML = sl.studio
      ? '<div class="slide studio"><p class="k">Presents</p><h2>' + P.studio + '</h2><p class="l">' + P.name + ' · The Series</p></div>'
      : '<div class="slide"><p class="k">' + sl.k + '</p><h2>' + sl.t + '</h2>' + sl.l.map(function (x) { return '<p class="l">' + x + '</p>'; }).join('') + (sl.c ? chips(sl.c) : '') + '</div>';
    $('#dots').innerHTML = slides.map(function (_, i) { return '<i class="' + (i < introIdx ? 'done' : i === introIdx ? 'on' : '') + '"></i>'; }).join('');
  }
  function step(d) { introIdx = Math.max(0, Math.min(slides.length - 1, introIdx + d)); draw(); }
  function end() { clearInterval(introTimer); document.removeEventListener('keydown', key); s.remove(); document.body.style.overflow = ''; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  function key(e) { if (e.key === 'Escape') end(); else if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1); }
  document.addEventListener('keydown', key);
  $('#in').onclick = function () { step(1); }; $('#ib').onclick = function () { step(-1); }; $('#ix').onclick = end;
  $('#ip').onclick = function () { introPaused = !introPaused; this.textContent = introPaused ? 'Play' : 'Pause'; };
  introTimer = setInterval(function () { if (introPaused) return; if (introIdx >= slides.length - 1) { introPaused = true; $('#ip').textContent = 'Play'; return; } step(1); }, 4200);
  draw(); $('#ix').focus();
}
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  var menu = $('#menu'); if (menu && !menu.hidden) { menu.hidden = true; $('#whoBtn').setAttribute('aria-expanded', 'false'); }
  if ($('.scrim')) closeScrim();
});

/* ===== footer + boot ===== */
$('#foot').innerHTML = '<span>© ' + P.name + ' · ' + P.location + '</span><span>Email <span class="em">' + P.email + '</span></span>';
renderSeason(); wireRows(document);
var saved = store.get('sp-viewer');
applyViewer(VIEWERS.filter(function (x) { return x.id === saved; })[0] || VIEWERS[0]);
</script>
